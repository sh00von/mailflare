services:
  replyot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4008:4008" # Web app & JMAP
      - "25:25"     # Inbound SMTP (open TCP 25 in Azure NSG)
    environment:
      PORT: 4008
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL}
      ADMIN_APP_URL: ${ADMIN_APP_URL}
      MAIL_APP_URL: ${MAIL_APP_URL}
      NEXT_PUBLIC_MAIL_APP_URL: ${NEXT_PUBLIC_MAIL_APP_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      SMTP_INBOUND_PORT: ${SMTP_INBOUND_PORT:-25}
      RESEND_API_KEY: ${RESEND_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      OUTBOUND_PROVIDER: ${OUTBOUND_PROVIDER:-auto}
      REDIS_URL: ${REDIS_URL:-}
      RSPAMD_URL: ${RSPAMD_URL:-}
      SYSTEM_FROM_EMAIL: ${SYSTEM_FROM_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_REGION: ${S3_REGION:-garage}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - replyot-data:/data

volumes:
  replyot-data:
