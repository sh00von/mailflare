services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-replyot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replyot_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-replyot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-replyot} -d ${POSTGRES_DB:-replyot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  replyot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000" # Routed by Coolify/Traefik (HTTPS)
    ports:
      - "25:25" # Inbound SMTP (open TCP 25 in Azure NSG)
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-replyot}:${POSTGRES_PASSWORD:-replyot_change_me}@postgres:5432/${POSTGRES_DB:-replyot}
      APP_URL: ${APP_URL}
      ADMIN_APP_URL: ${ADMIN_APP_URL}
      MAIL_APP_URL: ${MAIL_APP_URL}
      NEXT_PUBLIC_MAIL_APP_URL: ${NEXT_PUBLIC_MAIL_APP_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      SMTP_INBOUND_PORT: ${SMTP_INBOUND_PORT:-25}
      RESEND_API_KEY: ${RESEND_API_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - replyot-data:/data

volumes:
  replyot-data:
  postgres-data:

